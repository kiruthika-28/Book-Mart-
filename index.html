<!DOCTYPE html>
<html>
<head>
    <title>BookMart - Online Book Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        button {
            padding: 8px 15px;
            cursor: pointer;
        }

        button:disabled {
            cursor: not-allowed;
        }

        #cart {
            margin-top: 30px;
        }

        #welcome {
            font-weight: bold;
        }
    </style>
</head>

<body>

<h1>BOOKMART - ONLINE BOOK MANAGEMENT</h1>

<h2>Login</h2>

<input type="text" id="username" placeholder="Username">

<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>

<p id="welcome"></p>

<h2>Available Books</h2>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Author</th>
            <th>Category</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Action</th>
        </tr>
    </thead>

    <tbody id="bookTable"></tbody>
</table>

<div id="cart">

    <h2>Shopping Cart</h2>

    <ul id="cartList"></ul>

    <p id="total">Total: Rs.0</p>

    <button onclick="checkout()">Checkout</button>

</div>

<script>

let books = [
    {
        id: 1,
        title: "Java Programming",
        author: "Herbert Schildt",
        category: "Programming",
        price: 450,
        stock: 10
    },
    {
        id: 2,
        title: "Python Basics",
        author: "Mark Lutz",
        category: "Programming",
        price: 400,
        stock: 8
    },
    {
        id: 3,
        title: "Data Science",
        author: "John Smith",
        category: "Data Science",
        price: 550,
        stock: 5
    },
    {
        id: 4,
        title: "Artificial Intelligence",
        author: "Stuart Russell",
        category: "AI",
        price: 650,
        stock: 6
    }
];

let cart = [];

function login() {

    let username =
        document.getElementById("username").value;

    if (username.trim() === "") {

        alert("Please enter username");

        return;
    }

    document.getElementById("welcome").innerText =
        "Welcome " + username;
}

function displayBooks() {

    let table =
        document.getElementById("bookTable");

    table.innerHTML = "";

    books.forEach(book => {

        let row = table.insertRow();

        row.insertCell(0).innerText =
            book.id;

        row.insertCell(1).innerText =
            book.title;

        row.insertCell(2).innerText =
            book.author;

        row.insertCell(3).innerText =
            book.category;

        row.insertCell(4).innerText =
            "Rs." + book.price;

        row.insertCell(5).innerText =
            book.stock;

        let actionCell =
            row.insertCell(6);

        let button =
            document.createElement("button");

        button.innerText = "Add";

        button.onclick = function() {

            addToCart(book.id);

        };

        if (book.stock === 0) {

            button.disabled = true;

            button.innerText =
                "Out of Stock";
        }

        actionCell.appendChild(button);

    });
}

function addToCart(id) {

    let book =
        books.find(b => b.id === id);

    if (book.stock <= 0) {

        alert("Book is out of stock");

        return;
    }

    book.stock--;

    cart.push(book);

    displayBooks();

    displayCart();
}

function displayCart() {

    let cartList =
        document.getElementById("cartList");

    let totalElement =
        document.getElementById("total");

    cartList.innerHTML = "";

    let total = 0;

    cart.forEach(book => {

        let li =
            document.createElement("li");

        li.innerText =
            book.title +
            " - Rs." +
            book.price;

        cartList.appendChild(li);

        total += book.price;

    });

    totalElement.innerText =
        "Total: Rs." + total;
}

function checkout() {

    if (cart.length === 0) {

        alert("Cart is empty");

        return;
    }

    alert(
        "Payment Successful!\n" +
        "Thank you for shopping with BookMart."
    );

    cart = [];

    displayCart();

    displayBooks();
}

displayBooks();

displayCart();

</script>

</body>
</html>
