<!DOCTYPE html>
<html>
<head>

<title>BookMart - Online Book Management</title>

<style>

body {
    font-family: Arial, sans-serif;
    margin: 30px;
    background: #f5f5f5;
}

h1 {
    text-align: center;
}

.container {
    background: white;
    padding: 25px;
    border-radius: 10px;
}

input, select {
    padding: 8px;
    margin: 5px;
}

button {
    padding: 8px 15px;
    margin: 5px;
    cursor: pointer;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

th, td {
    border: 1px solid black;
    padding: 10px;
    text-align: center;
}

th {
    background: #ddd;
}

#cart {
    margin-top: 30px;
}

#welcome {
    font-weight: bold;
    color: green;
}

</style>

</head>

<body>

<div class="container">

<h1>BOOKMART - ONLINE BOOK MANAGEMENT</h1>

<h2>Login</h2>

<input type="text"
       id="username"
       placeholder="Username">

<input type="password"
       id="password"
       placeholder="Password">

<button onclick="login()">Login</button>

<p id="welcome"></p>

<hr>

<h2>Available Books</h2>

<input type="text"
       id="search"
       placeholder="Search book..."
       onkeyup="searchBooks()">

<table>

<thead>

<tr>

<th>ID</th>
<th>Title</th>
<th>Author</th>
<th>Category</th>
<th>Price</th>
<th>Stock</th>
<th>Action</th>

</tr>

</thead>

<tbody id="bookTable"></tbody>

</table>

<div id="cart">

<h2>Shopping Cart</h2>

<ul id="cartList"></ul>

<p id="total">Total: Rs.0</p>

<button onclick="checkout()">
Checkout
</button>

</div>

<hr>

<h2>Give Review</h2>

<input type="number"
       id="reviewBookId"
       placeholder="Book ID">

<select id="rating">

<option value="5">5</option>
<option value="4">4</option>
<option value="3">3</option>
<option value="2">2</option>
<option value="1">1</option>

</select>

<input type="text"
       id="comment"
       placeholder="Your comment">

<button onclick="submitReview()">
Submit Review
</button>

</div>

<script>

let books = [];
let cart = [];
let currentUserId = null;

async function loadBooks() {

    try {

        const response =
            await fetch("/api/books");

        books = await response.json();

        displayBooks();

    } catch (error) {

        alert("Cannot connect to Java backend");

    }
}

async function login() {

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;

    if (username.trim() === "" ||
        password.trim() === "") {

        alert("Enter username and password");
        return;
    }

    const data =
        new URLSearchParams();

    data.append("username", username);
    data.append("password", password);

    try {

        const response =
            await fetch("/api/login", {

                method: "POST",

                body: data

            });

        const result =
            await response.json();

        if (result.success) {

            currentUserId = result.userId;

            document.getElementById("welcome").innerText =
                "Welcome " + result.username;

            alert("Login successful");

        } else {

            alert(result.message);

        }

    } catch (error) {

        alert("Backend connection failed");

    }
}

function displayBooks(list = books) {

    const table =
        document.getElementById("bookTable");

    table.innerHTML = "";

    list.forEach(book => {

        const row =
            table.insertRow();

        row.insertCell(0).innerText =
            book.id;

        row.insertCell(1).innerText =
            book.title;

        row.insertCell(2).innerText =
            book.author;

        row.insertCell(3).innerText =
            book.category;

        row.insertCell(4).innerText =
            "Rs." + book.price;

        row.insertCell(5).innerText =
            book.stock;

        const action =
            row.insertCell(6);

        const button =
            document.createElement("button");

        button.innerText =
            book.stock > 0 ? "Add to Cart" : "Out of Stock";

        button.disabled =
            book.stock === 0;

        button.onclick =
            function() {

                addToCart(book.id);

            };

        action.appendChild(button);

    });
}

function searchBooks() {

    const search =
        document.getElementById("search")
        .value
        .toLowerCase();

    const result =
        books.filter(book =>

            book.title.toLowerCase().includes(search) ||

            book.author.toLowerCase().includes(search) ||

            book.category.toLowerCase().includes(search)

        );

    displayBooks(result);
}

function addToCart(id) {

    const book =
        books.find(b => b.id === id);

    if (!book || book.stock <= 0) {

        alert("Book is out of stock");
        return;
    }

    const existing =
        cart.find(item => item.id === id);

    if (existing) {

        if (existing.quantity >= book.stock) {

            alert("No more stock available");
            return;
        }

        existing.quantity++;

    } else {

        cart.push({

            id: book.id,
            title: book.title,
            price: book.price,
            quantity: 1

        });

    }

    displayCart();
}

function displayCart() {

    const cartList =
        document.getElementById("cartList");

    cartList.innerHTML = "";

    let total = 0;

    cart.forEach(item => {

        const li =
            document.createElement("li");

        const subtotal =
            item.price * item.quantity;

        li.innerText =
            item.title +
            " | Quantity: " +
            item.quantity +
            " | Rs." +
            subtotal;

        cartList.appendChild(li);

        total += subtotal;

    });

    document.getElementById("total")
        .innerText =
        "Total: Rs." + total;
}

async function checkout() {

    if (currentUserId === null) {

        alert("Please login first");
        return;
    }

    if (cart.length === 0) {

        alert("Cart is empty");
        return;
    }

    let total = 0;

    cart.forEach(item => {

        total +=
            item.price * item.quantity;

    });

    const items =
        cart.map(item =>
            item.id + ":" + item.quantity
        ).join(",");

    const data =
        new URLSearchParams();

    data.append("userId", currentUserId);
    data.append("total", total);
    data.append("items", items);

    try {

        const response =
            await fetch("/api/order", {

                method: "POST",

                body: data

            });

        const result =
            await response.json();

        if (result.success) {

            alert(
                "Payment Successful!\n" +
                "Order Confirmed!"
            );

            cart = [];

            displayCart();

            loadBooks();

        } else {

            alert(result.message);

        }

    } catch (error) {

        alert("Order failed");

    }
}

async function submitReview() {

    const bookId =
        document.getElementById("reviewBookId")
        .value;

    const rating =
        document.getElementById("rating")
        .value;

    const comment =
        document.getElementById("comment")
        .value;

    if (bookId === "" ||
        comment === "") {

        alert("Enter book ID and comment");
        return;
    }

    const data =
        new URLSearchParams();

    data.append("bookId", bookId);
    data.append("rating", rating);
    data.append("comment", comment);

    try {

        const response =
            await fetch("/api/review", {

                method: "POST",

                body: data

            });

        const result =
            await response.json();

        alert(result.message);

    } catch (error) {

        alert("Review failed");

    }
}

loadBooks();
displayCart();

</script>

</body>
</html>
